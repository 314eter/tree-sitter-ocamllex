[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tree-sitter-ocamllex"
description = "OCamllex grammar for tree-sitter"
version = "0.25.0"
keywords = ["incremental", "parsing", "tree-sitter", "ocaml", "ocamllex"]
classifiers = [
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Topic :: Software Development :: Compilers",
  "Topic :: Text Processing :: Linguistic",
  "Typing :: Typed"
]
authors = [{ name = "Pieter Goetschalckx" }]
requires-python = ">=3.10"
license.text = "MIT"
readme = "bindings/python/README.md"

[project.urls]
Homepage = "https://github.com/314eter/tree-sitter-ocamllex"

[project.optional-dependencies]
core = ["tree-sitter~=0.25"]

[tool.cibuildwheel]
build = "cp310-*"
build-frontend = "build"
